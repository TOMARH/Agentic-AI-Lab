name: Python quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-labs:
    name: Repository labs / decision messaging tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint decision integration
        run: ruff check scripts/day10 tests/test_decision_publisher.py

      - name: Test local decision and messaging contract
        run: python -m pytest tests/test_decision_model.py tests/test_decision_publisher.py -v

  day2-function:
    name: Day 2 Function / lint, tests, coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day2-function

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: day2-function/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests and coverage
        run: python -m pytest --cov=function_app --cov-report=term-missing --cov-fail-under=85
